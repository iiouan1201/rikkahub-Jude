name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: true

      - name: Install SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          echo '--- installed ---'
          ls -la "${ANDROID_SDK_ROOT}/platforms" || true
          ls -la "${ANDROID_SDK_ROOT}/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Build debug APK
        run: ./gradlew :app:assemblePublicDebug --stacktrace --no-daemon

      - name: Locate APK
        if: always()
        run: |
          find app/build/outputs -name '*.apk' -type f 2>/dev/null || echo 'no apk found'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-shizuku-debug-apk
          path: app/build/outputs/apk/public/debug/*.apk
          retention-days: 30
